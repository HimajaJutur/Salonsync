name: Deploy to Elastic Beanstalk

on:
  # Auto-deploy when Django CI workflow succeeds
  workflow_run:
    workflows: ["Django CI"]
    types: [completed]
    branches: [main]

  # Allow manual deployment
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Only run if:
    # - Manually triggered OR
    # - Django CI completed successfully
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      # 1. CHECKOUT FULL REPOSITORY (ROOT)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. SET UP PYTHON
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. INSTALL EB CLI
      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      # 4. CONFIGURE AWS CREDENTIALS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. VERIFY ENVIRONMENT EXISTS
      - name: Verify Elastic Beanstalk environment exists
        run: |
          echo "Checking if environment exists..."
          ENV_STATUS=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-names ${{ secrets.EB_ENV_NAME }} \
            --query 'Environments[?Status!=`Terminated`] | [0].Status' \
            --output text)

          if [ -z "$ENV_STATUS" ] || [ "$ENV_STATUS" = "None" ]; then
            echo "❌ ERROR: EB environment not found!"
            exit 1
          fi

          echo "✓ EB environment exists: $ENV_STATUS"

      # 6. GET LATEST PYTHON PLATFORM ARN
      - name: Fetch latest Python platform ARN
        id: platform
        run: |
          PLATFORM_ARN=$(aws elasticbeanstalk list-platform-versions \
            --filters Type=PlatformName,Operator=contains,Values=Python \
            --query 'PlatformSummaryList[?PlatformStatus==`Ready`][-1].PlatformArn' \
            --output text)

          echo "platform_arn=$PLATFORM_ARN" >> $GITHUB_OUTPUT
          echo "Using EB Platform: $PLATFORM_ARN"

      # 7. UPDATE EB ENVIRONMENT VARIABLES
      - name: Update EB environment variables
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-name ${{ secrets.EB_ENV_NAME }} \
            --option-settings \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SECRET_KEY,Value="${{ secrets.SECRET_KEY }}" \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=EMAIL_HOST_USER,Value="${{ secrets.EMAIL_HOST_USER }}" \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=EMAIL_HOST_PASSWORD,Value="${{ secrets.EMAIL_HOST_PASSWORD }}" \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=EMAIL_PORT,Value="${{ secrets.EMAIL_PORT }}" \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DEBUG,Value="False"

          echo "Waiting for environment update..."
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-names ${{ secrets.EB_ENV_NAME }}

          echo "✓ EB environment variables updated!"

      # 8. DEPLOY APPLICATION FROM ROOT (NO cd!)
      - name: Deploy to Elastic Beanstalk
        run: |
          eb init "${{ secrets.EB_APP_NAME }}" \
            --region "${{ secrets.AWS_REGION }}" \
            --platform "${{ steps.platform.outputs.platform_arn }}"

          eb deploy "${{ secrets.EB_ENV_NAME }}" \
            --label "deploy-${{ github.run_id }}" \
            --timeout 20

          echo "🎉 Deployment completed successfully!"
