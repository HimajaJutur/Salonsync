name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run pylint
    - name: Run pylint
      run: |
        pylint manage.py salonsync salon --fail-under=10.0

    # 5. Run SonarCloud Scan (new official GitHub Action)
    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=HimajaJutur_Salonsync
          -Dsonar.organization=himajajutur
          -Dsonar.python.version=3.12
          -Dsonar.sources=.
          -Dsonar.exclusions=**/env/**,**/migrations/**,**/static/**,**/media/**