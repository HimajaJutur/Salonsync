name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pylint

    # 4. Load environment variables
    - name: Set environment variables
      run: |
        echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
        echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> $GITHUB_ENV
        echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> $GITHUB_ENV
        echo "EMAIL_HOST=smtp.gmail.com" >> $GITHUB_ENV
        echo "EMAIL_PORT=587" >> $GITHUB_ENV
        echo "EMAIL_USE_TLS=True" >> $GITHUB_ENV
        echo "DEBUG=False" >> $GITHUB_ENV

    # 5. Run pylint (no fail for now)
    - name: Run pylint
      run: |
        pylint salon salonsync manage.py 

    # 6. Run tests with coverage
    - name: Run tests with coverage
      run: |
        coverage run --source=salon --omit="*/migrations/*" manage.py test
        coverage xml

    # 7. SonarCloud Scan with test coverage
    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=HimajaJutur_Salonsync
          -Dsonar.organization=himajajutur
          -Dsonar.sources=.
          -Dsonar.python.version=3.12
          -Dsonar.coverageReportPaths=coverage.xml
          -Dsonar.exclusions=**/env/**,**/migrations/**,**/static/**,**/media/**