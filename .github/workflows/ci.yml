name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run pylint
    - name: Run pylint
      run: |
        pylint manage.py salonsync salon --fail-under=10.0

    # 5. Cache SonarCloud binary
    - name: Cache SonarCloud Scanner
      id: cache-sonar
      uses: actions/cache@v3
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar

    # 6. Install SonarCloud Scanner
    - name: Install SonarCloud Scanner
      uses: sonarsource/sonarcloud-github-action@master

    # 7. Run SonarCloud Scan
    - name: SonarCloud Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        sonar-scanner \
          -Dsonar.projectKey=HimajaJutur_Salonsync \
          -Dsonar.organization=himajajutur \
          -Dsonar.python.version=3.12 \
          -Dsonar.sources=. \
          -Dsonar.exclusions=**/env/**,**/migrations/**,**/static/**,**/media/** \
          -Dsonar.login=${SONAR_TOKEN}