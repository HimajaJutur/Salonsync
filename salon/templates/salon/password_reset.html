{% extends 'salon/base.html' %}
{% block title %}Forgot Password | SalonSync{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:600px;">
  <h2 class="mb-4 text-center">🔑 Forgot your password?</h2>
  <p class="text-center text-muted">Enter your email and we’ll send you a link to reset it.</p>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-dark w-100 mt-3">Send Reset Link</button>
  </form>
</div>
{% endblock %}
