{% extends 'salon/base.html' %}
{% block content %}
<div class="container my-5" style="max-width:600px;">
  <h2 class="text-center">Set New Password</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-dark w-100 mt-3">Change Password</button>
  </form>
</div>
{% endblock %}
