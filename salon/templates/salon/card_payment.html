{% extends 'salon/base.html' %}
{% block title %}Card Payment{% endblock %}

{% block content %}

<div class="container my-5">
    <h3 class="text-center">💳 Pay by Card</h3>
    <p class="text-center">Amount: <strong>€{{ appointment.total_cost }}</strong></p>

    <form method="POST" class="card p-4 shadow" style="max-width:400px;margin:auto;">
        {% csrf_token %}
        
        <label class="form-label">Card Holder Name</label>
        <input type="text" class="form-control" required>

        <label class="form-label mt-3">Card Number</label>
        <input type="text" class="form-control" placeholder="**** **** **** 1234" required>

        <div class="row mt-3">
            <div class="col">
                <label class="form-label">Expiry</label>
                <input type="text" class="form-control" placeholder="MM/YY" required>
            </div>
            <div class="col">
                <label class="form-label">CVV</label>
                <input type="password" class="form-control" required>
            </div>
        </div>

        <button class="btn btn-primary w-100 mt-4">Pay Now</button>
    </form>
</div>
{% endblock %}
