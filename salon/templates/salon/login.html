{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SalonSync</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Smooth card animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fade + Zoom for logo */
        @keyframes fadeZoom {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-container {
            background-color: #fff;
            width: 400px;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        .logo {
            width: 150px; /* 🔹 slightly larger */
            height: auto;
            margin-bottom: 10px;
            animation: fadeZoom 0.8s ease-out;
        }

        h2 {
            margin: 8px 0 5px;
            font-weight: 600;
            color: #333;
        }

        p {
            margin: 4px 0 15px;
            font-size: 14px;
            color: #666;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        input[type="text"],
        input[type="password"] {
            padding: 11px 14px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #d4a762;
            box-shadow: 0 0 6px rgba(212, 167, 98, 0.5);
        }

        button {
            background: linear-gradient(90deg, #d4a762, #b5853d);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            margin-top: 12px;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .register-text {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }

        .register-text a {
            color: #d4a762;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .register-text a:hover {
            color: #b5853d;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <img src="{% static 'salon/img/logo.png' %}" alt="SalonSync Logo" class="logo" onerror="this.style.display='none'">

        <h2>Sign in</h2>
        <p>Enter your <strong>username or email</strong> and password</p>

        <form method="POST">
            {% csrf_token %}
    
            <label for="id_username" style="text-align:left; display:block; font-size:13px; font-weight:500; color:#333;">Username or Email:</label>
            <input type="text" name="username" id="id_username" placeholder="Enter username or email" required>

            <label for="id_password" style="text-align:left; display:block; font-size:13px; font-weight:500; color:#333;">Password:</label>
            <input type="password" name="password" id="id_password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p class="mt-3 text-center">
            <a href="{% url 'reset_password' %}">Forgot Password?</a>
        </p>
        <!-- 💬 Message display for errors (like wrong password) -->
        {% if messages %}
            {% for message in messages %}
                <div style="
                    background: {% if message.tags == 'error' %}#fbeaea{% else %}#e7f6e7{% endif %};
                    color: {% if message.tags == 'error' %}#b71c1c{% else %}#1b5e20{% endif %};
                    padding: 10px 14px;
                    border-radius: 8px;
                    font-size: 13px;
                    margin-top: 15px;
                    border: 1px solid {% if message.tags == 'error' %}#f5c2c2{% else %}#c8e6c9{% endif %};
                    text-align: left;
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}


        <p class="register-text">
            Don’t have an account?
            <a href="{% url 'register' %}">Register here</a>
        </p>
    </div>
<script>
    // Auto-hide messages after 3 seconds
    setTimeout(() => {
        document.querySelectorAll('div[style*="background"]').forEach(div => {
            div.style.transition = 'opacity 0.6s ease';
            div.style.opacity = '0';
        });
    }, 3000);
</script>

</body>
</html>
